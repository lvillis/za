name: CI

on:
  push:
    branches: [main]
    tags:
      - "*"
    paths:
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        shell: bash
        run: |
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          export RUSTUP_TOOLCHAIN="$rust_version"
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt --component clippy --no-self-update
          rustc --version
          cargo --version

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked
