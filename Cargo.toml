[package]
name = "za"
description = "CLI for tool management, dependency health, and remote development."
version = "0.1.101"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
authors = ["lvillis <lvillis@outlook.com>"]
repository = "https://github.com/lvillis/za"
homepage = "https://github.com/lvillis/za"
documentation = "https://github.com/lvillis/za/blob/main/README.md"
include = [
  "assets/**",
  "src/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions", "color"] }
shellcomp = { version = "0.1.15", default-features = false, features = ["clap"] }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
humantime = { version = "2.4.0", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
signal-hook = { version = "0.4.4", default-features = false }
semver = { version = "1.0.28", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

ignore = { version = "0.4.33", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "perf"] }

serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "display"] }
graviola = { version = "0.4.1", default-features = false }

reqx = { version = "0.2.3", default-features = false, features = ["blocking-tls-rustls-ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }

flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
xz2 = { version = "0.1.7", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[features]
default = []

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[package.metadata.release]
tag-prefix = ""
tag-name = "{{prefix}}{{version}}"
pre-release-commit-message = "chore: release {{crate_name}} version {{version}}"
tag-message = "chore: release {{crate_name}} version {{version}}"
pre-release-hook = ["git", "cliff", "-o", "CHANGELOG.md", "--tag", "{{version}}"]
